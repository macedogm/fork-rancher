name: "Setup and build chart"
description: "Install dependencies, pull files and build the Rancher chart"
runs:
  using: "composite"
  steps:
    - name: install dependencies
      shell: bash
      run: zypper install -y aws-cli
    - name: Setup Tag Env Variables
      uses: $/.github/actions/setup-tag-env
    - id: env
      name: Setup Dependencies Env Variables
      uses: $/.github/actions/setup-build-env
    - name: Install Helm dependencies
      env:
         HELM_UNITTEST_VERSION: ${{ steps.env.outputs.HELM_UNITTEST_VERSION }}
      shell: bash
      run: |
        set -ex
        zypper ar -f https://rpm.rancher.io/pkgs/prime pkgs
        rpm --import https://raw.githubusercontent.com/rancher/rancher/refs/heads/main/rancher-rpm-pkgs.key
        zypper in -y -r pkgs helm4
        ln -sf /usr/bin/helm4 /usr/bin/helm
        helm plugin install https://github.com/helm-unittest/helm-unittest.git --version ${HELM_UNITTEST_VERSION} --verify=false;
    - name: Build
      shell: bash
      run: ./scripts/chart/build chart
    - name: Validate
      shell: bash
      run: ./scripts/chart/validate
    - name: Test
      shell: bash
      run: ./scripts/chart/test
    - name: Package
      shell: bash
      run: ./scripts/chart/package
    - name: Prepare for upload
      shell: bash
      run: |
        set -e
        source scripts/version
        cp bin/chart/${CHART_REPO}/rancher-${CHART_VERSION}.tgz /tmp/rancher-chart.tgz
    - name: Upload chart
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: "rancher-chart"
        path: /tmp/rancher-chart.tgz
        if-no-files-found: error
        retention-days: 4
        overwrite: false
